<!DOCTYPE html>
<html>
<head>
    <style> body{
        background-color: #5B0202;
        margin: 0;
        padding-bottom: 1000px;
    }
.searchbar 
{
    border-radius: 40px;
    width: 450px;
    height: 60px;
    padding-left: 20px;
    font-size: 18px;
    font-family: 'Inter' , sans-serif;
    background:
    radial-gradient(circle at 20% 30%, #EDE7C7 0, transparent 40%),
    radial-gradient(circle at 80% 70%, #c2bea9 0, transparent 40%),
    #b5b198;
    border: none;
}

.searchbar:focus
{
    outline: none;
    box-shadow: 6px 3px 5px rgba(0, 0, 0, 0.3);
}

.searching {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 200px;
}

.header{
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background-color: #77735e;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 2;
}

.mark {
    position: relative;
    display: inline-block;
}

  .mark::before {
  content: "";
  position: absolute;
  top: -0.35em;
  left: 50%;
  transform: translateX(-50%);
  width: 0.6em;
  height: 1px;
  background: currentColor;
}

.logo-pic
{
    margin-left:0
}

.logo-text 
{
    font-family: "Jost", "Josefin Sans", sans-serif;
    font-weight: lighter;
    font-size: 50px;
    letter-spacing: 1px;
    color:#EDE7C7;
    text-transform: uppercase;



}

.z
{
    margin-top: 0;
    width: 100px;
    height: 100px;
}

.menu-text
{
    display: inline-block;
}

.menu-button
{
    display: flex;
    justify-content: end;
}


.hamburger
{
    background-color: transparent;
    border: none;
}

    </style>
</head>
<body>
    <div class="header">


        <div class="logo-pic">
            <img class="z" src="logo/logo-removebg-preview.png">
        </div>


        <div class="logo-text">
            INT M&Lambda;P
        </div>



        <div class="menu-button">
            <button class="hamburger"><img src="logo/Hamburger_icon.svg"></button>
        </div>


    </div>

    <div class="searching">
        <input type="text" class="searchbar"
        placeholder="Search in IntMap">
    </div>


</body>
</html>
